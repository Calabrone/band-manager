<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="stage" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#5b1a1a"/>
      <stop offset="0.55" stop-color="#220c10"/>
      <stop offset="1" stop-color="#0a0608"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a2b"/>
      <stop offset="0.5" stop-color="#c4151c"/>
      <stop offset="1" stop-color="#6d0a12"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d949c"/>
      <stop offset="0.45" stop-color="#f4f6f8"/>
      <stop offset="1" stop-color="#6b727a"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a2a14"/>
      <stop offset="0.5" stop-color="#7a4a26"/>
      <stop offset="1" stop-color="#3b2010"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9cf9c"/>
      <stop offset="1" stop-color="#b98f55"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Sfondo palco -->
  <rect width="512" height="512" rx="80" fill="url(#stage)"/>

  <!-- Raggi dei fari -->
  <g opacity="0.16" fill="#ffd9a0">
    <polygon points="256,-10 120,512 190,512"/>
    <polygon points="256,-10 322,512 392,512"/>
  </g>

  <!-- Bacchette incrociate -->
  <g transform="rotate(38 256 256)">
    <rect x="243" y="52" width="14" height="410" rx="7" fill="url(#stick)"/>
    <ellipse cx="250" cy="58" rx="9" ry="13" fill="#e9cf9c"/>
  </g>
  <g transform="rotate(-38 256 256)">
    <rect x="255" y="52" width="14" height="410" rx="7" fill="url(#stick)"/>
    <ellipse cx="262" cy="58" rx="9" ry="13" fill="#e9cf9c"/>
  </g>

  <!-- Alone dietro la chitarra -->
  <ellipse cx="256" cy="330" rx="110" ry="100" fill="#ff3b1f" opacity="0.45" filter="url(#glow)"/>

  <!-- Chitarra elettrica, inclinata -->
  <g transform="rotate(-24 256 270)">
    <!-- Manico -->
    <rect x="240" y="40" width="32" height="250" rx="4" fill="url(#neck)"/>
    <g stroke="#c9ced4" stroke-width="2.4">
      <line x1="240" y1="90" x2="272" y2="90"/>
      <line x1="240" y1="125" x2="272" y2="125"/>
      <line x1="240" y1="160" x2="272" y2="160"/>
      <line x1="240" y1="195" x2="272" y2="195"/>
      <line x1="240" y1="230" x2="272" y2="230"/>
    </g>
    <g fill="#f3e9d2">
      <circle cx="256" cy="107" r="3.5"/>
      <circle cx="256" cy="177" r="3.5"/>
      <circle cx="256" cy="212" r="3.5"/>
    </g>
    <!-- Paletta -->
    <path d="M236 44 L276 44 L282 6 Q256 -6 230 6 Z" fill="#1c1210"/>
    <g fill="url(#chrome)">
      <circle cx="238" cy="20" r="4.5"/><circle cx="238" cy="34" r="4.5"/>
      <circle cx="274" cy="20" r="4.5"/><circle cx="274" cy="34" r="4.5"/>
    </g>
    <!-- Corpo double-cut -->
    <path d="M256 250
             C226 232 196 236 178 262
             C164 284 170 300 184 312
             C160 332 156 372 172 402
             C192 440 232 456 256 456
             C280 456 320 440 340 402
             C356 372 352 332 328 312
             C342 300 348 284 334 262
             C316 236 286 232 256 250 Z"
          fill="url(#body)" stroke="#2a0508" stroke-width="5"/>
    <!-- Riflesso -->
    <path d="M190 276 C200 262 222 256 240 262 C222 268 206 282 200 304 C190 296 184 286 190 276 Z" fill="#fff" opacity="0.28"/>
    <!-- Pickup e ponte -->
    <rect x="228" y="296" width="56" height="14" rx="3" fill="#15100f" stroke="#c9ced4" stroke-width="2"/>
    <rect x="228" y="332" width="56" height="14" rx="3" fill="#15100f" stroke="#c9ced4" stroke-width="2"/>
    <rect x="222" y="388" width="68" height="10" rx="3" fill="url(#chrome)"/>
    <!-- Manopole -->
    <circle cx="304" cy="400" r="9" fill="url(#chrome)"/>
    <circle cx="326" cy="384" r="9" fill="url(#chrome)"/>
    <!-- Corde -->
    <g stroke="#e8ebee" stroke-width="1.6">
      <line x1="245" y1="44" x2="245" y2="392"/>
      <line x1="251" y1="44" x2="251" y2="392"/>
      <line x1="257" y1="44" x2="257" y2="392"/>
      <line x1="263" y1="44" x2="263" y2="392"/>
      <line x1="268" y1="44" x2="268" y2="392"/>
    </g>
  </g>

  <!-- Fulmine -->
  <path d="M410 70 L352 168 L392 168 L364 252 L446 138 L402 138 L436 70 Z"
        fill="url(#bolt)" stroke="#7a3a00" stroke-width="3" stroke-linejoin="round"/>

  <!-- Cornice sottile -->
  <rect x="3" y="3" width="506" height="506" rx="77" fill="none" stroke="#ff4a2b" stroke-opacity="0.55" stroke-width="3"/>
</svg>
